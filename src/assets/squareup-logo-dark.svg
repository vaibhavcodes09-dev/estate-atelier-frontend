<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" fill="none">
  <!-- Left Icon Graphic -->
  <g transform="translate(10, 8)">
    <!-- Red Polygon Block -->
    <path d="M16 68 L48 38 L48 84 L16 100 Z" fill="#FF3B30" />
    
    <!-- Rear Spire Building -->
    <path d="M51 28 L65 40 L65 92 L51 92 Z" fill="#E2E8F0" />

    <!-- High-rise Building with Diagonal Window Slits -->
    <path d="M80 22 L124 38 L124 112 L80 112 Z" fill="#E2E8F0" />
    <!-- Diagonal Slit Lines -->
    <line x1="84" y1="36" x2="120" y2="49" stroke="#0F172A" stroke-width="3" />
    <line x1="84" y1="46" x2="120" y2="59" stroke="#0F172A" stroke-width="3" />
    <line x1="84" y1="56" x2="120" y2="69" stroke="#0F172A" stroke-width="3" />
    <line x1="84" y1="66" x2="120" y2="79" stroke="#0F172A" stroke-width="3" />
    <line x1="84" y1="76" x2="120" y2="89" stroke="#0F172A" stroke-width="3" />
    <line x1="84" y1="86" x2="120" y2="99" stroke="#0F172A" stroke-width="3" />

    <!-- Chimney on Roof -->
    <rect x="66" y="74" width="7" height="18" fill="#E2E8F0" />

    <!-- Front House Roof Peak and Base Line -->
    <path d="M2 112 L48 66 L94 112" stroke="#E2E8F0" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" fill="none" />
    <path d="M0 112 H126" stroke="#E2E8F0" stroke-width="8" stroke-linecap="square" />
    
    <!-- Small Window in Roof Peak -->
    <g transform="translate(42, 94)">
      <rect x="0" y="0" width="5" height="5" fill="#E2E8F0" />
      <rect x="7" y="0" width="5" height="5" fill="#E2E8F0" />
      <rect x="0" y="7" width="5" height="5" fill="#E2E8F0" />
      <rect x="7" y="7" width="5" height="5" fill="#E2E8F0" />
    </g>
  </g>

  <!-- Right Text: SQUAREUP PROPERTIES (White variant for dark theme) -->
  <g fill="#FFFFFF">
    <text x="145" y="70" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="44" letter-spacing="1">SQUAREUP</text>
    <text x="175" y="106" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="800" font-size="30" fill="#CBD5E1" letter-spacing="4">PROPERTIES</text>
  </g>
</svg>
